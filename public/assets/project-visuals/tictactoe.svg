  <circle cx="40" cy="30" r="8" fill="#ef4444"/><circle cx="68" cy="30" r="8" fill="#f59e0b"/><circle cx="96" cy="30" r="8" fill="#22c55e"/>
  <text x="60" y="115" fill="#38bdf8" font-size="26" font-family="monospace">TIC-TAC-TOE</text>
